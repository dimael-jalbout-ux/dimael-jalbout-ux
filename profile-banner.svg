<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Dima Jalbout, evidence to action</title>
  <desc id="desc">A deep teal banner with a three part line diagram: evidence, judgement, action.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142d38"/><stop offset="1" stop-color="#203f48"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a779"/><stop offset=".55" stop-color="#c8c3a0"/><stop offset="1" stop-color="#9bbb9d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" rx="24" fill="url(#bg)"/>
  <circle cx="1060" cy="136" r="102" fill="none" stroke="#ffffff" stroke-opacity=".07"/>
  <circle cx="1060" cy="136" r="76" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  <path d="M770 145 C840 145 850 92 925 92 S1002 185 1074 185 S1128 128 1160 128" fill="none" stroke="url(#line)" stroke-width="2"/>
  <g fill="#f5f1e9" font-family="Arial, Helvetica, sans-serif">
    <text x="66" y="93" font-size="16" font-weight="700" letter-spacing="3" fill="#c9d1c9">FINANCE · STRATEGY · TRANSFORMATION</text>
    <text x="62" y="168" font-size="54" font-weight="700" letter-spacing="-1">Evidence first.</text>
    <text x="64" y="213" font-size="24" fill="#d7dfd9">Clarity next. Practical action always.</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#dfe7df">
    <circle cx="770" cy="145" r="7" fill="#d9a779"/><text x="770" y="177" text-anchor="middle">EVIDENCE</text>
    <circle cx="925" cy="92" r="7" fill="#c8c3a0"/><text x="925" y="67" text-anchor="middle">JUDGEMENT</text>
    <circle cx="1074" cy="185" r="7" fill="#9bbb9d"/><text x="1074" y="220" text-anchor="middle">ACTION</text>
    <circle cx="1160" cy="128" r="7" fill="#f5f1e9"/>
  </g>
</svg>